name: Supabase keepalive

# Dos chequeos periódicos de cosas que fallan en silencio.
#
# 1. KEEPALIVE. El free tier de Supabase pausa los proyectos después de ~7 días
#    sin actividad. Este workflow le pega a la función public.ping() dos veces
#    por semana para que eso no pase — el proyecto anterior se perdió así.
#
# 2. TILES DEL MAPA. CARTO, el proveedor anterior, pasó a exigir API key y
#    empezó a devolver —con HTTP 200— un PNG de marca de agua en lugar del
#    mapa. Los mapas estuvieron rotos en producción sin que nada lo reportara:
#    no hay error en consola ni request fallida cuando el servidor responde 200
#    con una imagen. El chequeo de abajo detecta exactamente ese modo de falla.
#
# Necesita dos secrets del repo (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  la publishable key (sb_publishable_...)
#
# La key es pública por diseño (viaja al navegador en el bundle), pero va como
# secret igual: así se rota en un solo lugar y no queda en el historial de git.

on:
  # Lunes y jueves 12:00 UTC (09:00 ART). Deja gaps de 3 y 4 días — cómodo
  # dentro de la ventana de 7. Si un run falla, el siguiente llega a tiempo.
  schedule:
    - cron: "0 12 * * 1,4"
  # Para poder dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Sin permisos sobre el repo: este job sólo hace una request salida.
permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY."
            exit 1
          fi

          # --retry cubre blips de red: sin esto un timeout casual manda un mail
          # de "workflow failed" que no significa nada.
          code=$(curl -sS \
            --retry 3 --retry-delay 10 --retry-connrefused \
            --max-time 30 \
            -o response.txt -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' || true)

          body=$(cat response.txt 2>/dev/null || echo '<sin cuerpo>')
          echo "HTTP ${code:-000} — ${body}"

          if [ "${code}" = "200" ]; then
            echo "Proyecto despierto. Timestamp devuelto: ${body}"
            exit 0
          fi

          echo "::error::El ping falló (HTTP ${code:-000}). Causas típicas:"
          echo "  000/5xx → el proyecto ya está pausado. Hay que reactivarlo a"
          echo "            mano desde el dashboard; el cron no lo despierta."
          echo "  401     → la publishable key cambió o se rotó. Actualizar el secret."
          echo "  404     → falta la función ping(). Correr la migración"
          echo "            supabase/migrations/20260925150000_add_ping_function.sql"
          exit 1

      # `always()` para que corra aunque el ping haya fallado: son dos cosas
      # independientes y conviene enterarse de ambas en el mismo run.
      - name: Verificar los tiles del mapa
        if: always()
        run: |
          set -uo pipefail

          BASE="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile"
          # Dos tiles testigo de zonas muy distintas y con contenido: uno sobre
          # Salta a zoom 11 (el que la landing realmente pide) y otro sobre el
          # norte argentino a zoom 7. Tienen que verse distintos entre sí.
          TILE_A="11/1169/651"
          TILE_B="7/73/40"

          bajar() {
            curl -sS --retry 3 --retry-delay 5 --retry-connrefused --max-time 30 \
              -o "$2" -w '%{http_code}' "$BASE/$1" || echo "000"
          }

          code_a=$(bajar "$TILE_A" a.png)
          code_b=$(bajar "$TILE_B" b.png)
          size_a=$(wc -c < a.png 2>/dev/null || echo 0)
          size_b=$(wc -c < b.png 2>/dev/null || echo 0)
          sha_a=$(sha256sum a.png | cut -d' ' -f1)
          sha_b=$(sha256sum b.png | cut -d' ' -f1)

          echo "tile A ($TILE_A): HTTP $code_a, $size_a bytes"
          echo "tile B ($TILE_B): HTTP $code_b, $size_b bytes"

          if [ "$code_a" != "200" ] || [ "$code_b" != "200" ]; then
            echo "::error::El servidor de tiles no responde 200 (A=$code_a B=$code_b)."
            echo "  Los mapas de la sección de regiones van a verse vacíos."
            exit 1
          fi

          # Un tile real pesa unos pocos KB; si viene casi vacío, algo cambió.
          if [ "$size_a" -lt 500 ] || [ "$size_b" -lt 500 ]; then
            echo "::error::Los tiles llegan casi vacíos (A=$size_a B=$size_b bytes)."
            exit 1
          fi

          # LA PRUEBA QUE IMPORTA: dos tiles de lugares distintos tienen que
          # dar imágenes distintas. Si son idénticas, el servidor está
          # devolviendo siempre lo mismo — una marca de agua o un placeholder
          # de error — y eso es justo lo que pasó con CARTO.
          if [ "$sha_a" = "$sha_b" ]; then
            echo "::error::Los dos tiles son la MISMA imagen."
            echo "  El proveedor está devolviendo un placeholder en vez del mapa,"
            echo "  probablemente porque ahora pide API key. Los mapas se ven rotos"
            echo "  aunque las requests den 200."
            echo "  Arreglo: cambiar el proveedor en src/components/ui/RegionMap.tsx"
            exit 1
          fi

          echo "Tiles OK: dos zonas distintas devuelven imágenes distintas."
